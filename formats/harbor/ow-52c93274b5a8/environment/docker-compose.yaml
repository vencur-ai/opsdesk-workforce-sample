# main: where the agent runs (no app code, no task data, no key). app: the OpsDesk Workforce workspace.
# The app writes its record to workspace-out; main can only read it. The record is the call log and the state hash –
# no state (no staged event, no budget that is only in a mail); the verifier replays the calls and checks the hash.
services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    environment:
      OPSDESK_URL: http://app:8080
    volumes:
      - workspace-out:/workspace-out:ro
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      OPSDESK_TASK: ow-52c93274b5a8
      OPSDESK_WORKSPACE_OUT: /workspace-out
    volumes:
      - workspace-out:/workspace-out
volumes:
  workspace-out:
